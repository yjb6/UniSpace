<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">UniSpace task mark</title>
  <desc id="desc">UniSpace connected to visual understanding, editing, and generation.</desc>
  <rect width="720" height="720" fill="#ffffff"/>
  <g fill="none" stroke="#25261f" stroke-width="6">
    <circle cx="360" cy="360" r="278"/>
    <ellipse cx="360" cy="360" rx="303" ry="181" transform="rotate(-24 360 360)"/>
  </g>

  <circle cx="360" cy="360" r="108" fill="#dfff55" stroke="#12130f" stroke-width="7"/>
  <text x="360" y="399" text-anchor="middle" fill="#12130f" font-family="Arial,Helvetica,sans-serif" font-size="116" font-weight="900">U</text>

  <!-- Understanding: eye -->
  <g transform="translate(360 82)">
    <circle r="58" fill="#f3f0e8" stroke="#12130f" stroke-width="7"/>
    <path d="M-37 0C-18-25 18-25 37 0C18 25-18 25-37 0Z" fill="none" stroke="#12130f" stroke-width="7" stroke-linejoin="round"/>
    <circle r="12" fill="#12130f"/>
  </g>

  <!-- Editing: pencil -->
  <g transform="translate(96 479)">
    <circle r="58" fill="#f3f0e8" stroke="#12130f" stroke-width="7"/>
    <path d="M-25 25L-17-5L17-39L38-18L4 16Z" fill="#ffffff" stroke="#12130f" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-17-5L4 16M13-34L33-13M-25 25L-4 19" fill="none" stroke="#12130f" stroke-width="7"/>
  </g>

  <!-- Generation: sparkle -->
  <g transform="translate(624 468)">
    <circle r="58" fill="#ff6b3d" stroke="#12130f" stroke-width="7"/>
    <path d="M0-38C3-13 13-3 38 0C13 3 3 13 0 38C-3 13-13 3-38 0C-13-3-3-13 0-38Z" fill="#ffffff" stroke="#12130f" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
