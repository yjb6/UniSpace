# VAE config for unispace unified-multimodal inference.
# Used by the SFT/0012000 checkpoint (and the S3/0060000 corder line).
#
# encoder: Qwen3Unified (Qwen3-VL-8B-Instruct backbone, recon_proj_dim=128)
# decoder: ViTXL_nockpt
#
# Paths use ${oc.env:VAR,default} — set the env vars to your local paths, or let
# them fall back to the defaults. The VAE checkpoint and normalization_stats.pt
# are distributed with the PR-Qwen-ViT release artifacts (see the repository
# README); point PR_CHECKPOINT_ROOT / PR_STATS_ROOT at those locations.

stage_1:
  target: stage1.PatchReparam
  params:
    encoder_cls: Qwen3Unified
    encoder_config_path: ${oc.env:MODEL_ROOT,/path/to/models}/Qwen/Qwen3-VL-8B-Instruct
    encoder_input_size: 256
    encoder_params:
      model_name: ${oc.env:MODEL_ROOT,/path/to/models}/Qwen/Qwen3-VL-8B-Instruct
      recon_proj_dim: 128
      pixel_format: c_major
    decoder_config_path: configs/decoder/ViTXL_nockpt
    decoder_cls: ViTDecoder
    noise_tau: 0.8
    reshape_to_2d: true
    normalization_stat_path: ${oc.env:PR_STATS_ROOT,/path/to/stats}/pr-qwen-vit-normalization-stats.pt
  checkpoint:
    path: ${oc.env:PR_CHECKPOINT_ROOT,/path/to/ckpts}/pr-qwen-vit-tokenizer.pt
    use_ema: true
training:
  total_steps: 250000
  ema_decay: 0.9978
  tokens_per_batch: 32768
  perceptual_resize: 256
  perceptual_crop: true
  perceptual_crop_mode: random
  grad_accum_steps: 1
  log_interval: 100
  checkpoint_interval: 500
  sample_every: 1000
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    lr: 0.0001
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: constant
    warmup_steps: 2500
    base_lr: 0.0001
    warmup_from_zero: true
data_config: configs/data/t2i_varlen_mar1024_with_imagenet256_imagesample.yaml
eval:
  dataset: imagenet_val_256
  eval_model: false
  data_path: ${oc.env:DATA_ROOT,/path/to/ImageNet1k}/val/
  reference_npz_path: ${oc.env:FID_STATS_ROOT,/path/to/fid_stats}/image_net_val/val.npz
  eval_interval: 2500
  metrics: [psnr, ssim, rfid]
gan:
  pretrained_discriminator_checkpoint: ${oc.env:CKPT_ROOT,/path/to/ckpts}/qwen3-unified-mar256-t2i-INvarlen-resume75K/checkpoints/step-00130000.pt
  disc:
    arch:
      dino_ckpt_path: ${oc.env:MODEL_ROOT,/path/to/models}/dino_vit_small_patch8_224.pth
      ks: 9
      norm_type: bn
      using_spec_norm: true
      recipe: S_8
    optimizer:
      lr: 0.0001
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: constant
      warmup_steps: 2500
      base_lr: 0.0001
      warmup_from_zero: true
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    disc_start: 0
    disc_upd_start: 0
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
